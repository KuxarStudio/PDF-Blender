name: Build & release

# Compila pdf_tools_v2.exe en Windows con PyInstaller.
# - En cada PR: solo compila y sube el .exe como artefacto (comprobación).
# - Manual ("Run workflow"): compila, crea la etiqueta y publica la release con
#   el .exe y su SHA-256.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta de la versión (p. ej. v1.0)"
        required: true
        default: "v1.0"
      target:
        description: "Rama o commit sobre el que crear la etiqueta"
        required: true
        default: "main"
      title:
        description: "Título de la release"
        required: true
        default: "PDF Tools Pro"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target || '' }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller==6.22.3"

      - name: Build .exe
        run: pyinstaller --onefile --windowed --name pdf_tools_v2 pdf_tools_v2.py

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/pdf_tools_v2.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  pdf_tools_v2.exe" | Out-File -Encoding ascii dist/pdf_tools_v2.exe.sha256
          Get-Content dist/pdf_tools_v2.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: pdf_tools_v2
          path: |
            dist/pdf_tools_v2.exe
            dist/pdf_tools_v2.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: pdf_tools_v2
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          TITLE: ${{ inputs.title }}
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TARGET}" --jq .sha)
          notes="Versión de escritorio para Windows: descarga \`pdf_tools_v2.exe\` y ábrelo con doble clic. 100 % offline: ningún archivo sale de tu ordenador.

          Compilado automáticamente desde el commit ${sha:0:7} con PyInstaller. Comprueba la descarga con el SHA-256 de \`pdf_tools_v2.exe.sha256\`."
          gh release create "$TAG" dist/pdf_tools_v2.exe dist/pdf_tools_v2.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$sha" --title "$TITLE" --notes "$notes" --latest
